<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('images/bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: black;
    }

    .container {
      text-align: center;
      margin-top: 150px;
      background-color: rgba(255, 255, 255, 0.8);
      display: inline-block;
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      font-size: 36px;
      color: black;
      margin-bottom: 10px;
    }

    #datetime {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .time-block {
      font-size: 22px;
      margin: 5px 0;
    }

    .wrapper {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <h1>Time in India</h1>
      <div id="datetime"></div>
      <div class="time-block" id="hours"></div>
      <div class="time-block" id="minutes"></div>
      <div class="time-block" id="seconds"></div>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();

      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      // Full date and time string
      document.getElementById("datetime").innerHTML = now.toString();

      // Individual time blocks
      document.getElementById("hours").innerHTML = `${hours} Hours`;
      document.getElementById("minutes").innerHTML = `${minutes} Minutes`;
      document.getElementById("seconds").innerHTML = `${seconds} Seconds`;
    }

    // Run every 1 second
    setInterval(updateTime, 1000);
    updateTime(); // Initial call
  </script>
</body>
</html>
